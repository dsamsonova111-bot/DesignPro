{% extends 'base.html' %}

{% block content %}
<h2>Создание заявки</h2>
<form method="post" enctype="multipart/form-data" novalidate class="mt-3" style="max-width: 600px;">
    {% csrf_token %}
    {% for field in form %}
        <div class="mb-3">
            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <div class="text-danger small mt-1">{{ field.errors|join:", " }}</div>
            {% endif %}
        </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Создать</button>
    <a href="{% url 'profile' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
