{% extends 'base.html' %}

{% block content %}
<h2>Подтверждение удаления заявки</h2>
<p>Вы действительно хотите удалить заявку «{{ design_request.title }}»?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Подтвердить удаление</button>
    <a href="{% url 'profile' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
