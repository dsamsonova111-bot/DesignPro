{% extends 'base.html' %}

{% block content %}
<h2>Удаление категории</h2>
<p class="mt-3">
    Вы уверены, что хотите удалить категорию <strong>«{{ category.name }}»</strong>?
</p>
<p class="text-danger small">
    Внимание: вместе с категорией могут быть удалены все связанные с ней заявки.
</p>

<form method="post" class="mt-3">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'category_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
