{% extends 'base.html' %}

{% block content %}
<h2>Принять заявку в работу: {{ design_request.title }}</h2>
<form method="post" novalidate class="mt-3" style="max-width: 500px;">
    {% csrf_token %}
    {% for field in form %}
        <div class="mb-3">
            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <div class="text-danger small mt-1">{{ field.errors|join:", " }}</div>
            {% endif %}
        </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Сохранить статус</button>
    <a href="{% url 'admin_panel' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
