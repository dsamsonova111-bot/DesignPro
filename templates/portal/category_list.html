{% extends 'base.html' %}

{% block content %}
<h2>Категории заявок</h2>
<div class="row mt-3">
    <div class="col-md-4 mb-3">
        <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
                <label for="{{ form.name.id_for_label }}" class="form-label">Новая категория</label>
                {{ form.name }}
                {% if form.name.errors %}
                    <div class="text-danger small mt-1">{{ form.name.errors|join:", " }}</div>
                {% endif %}
            </div>
            <button type="submit" class="btn btn-primary">Добавить</button>
        </form>
    </div>
    <div class="col-md-8">
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Название</th>
                    <th style="width: 120px;">Действие</th>
                </tr>
            </thead>
            <tbody>
                {% for cat in categories %}
                    <tr>
                        <td>{{ cat.name }}</td>
                        <td><a href="{% url 'category_delete' cat.pk %}" class="btn btn-danger btn-sm">Удалить</a></td>
                    </tr>
                {% empty %}
                    <tr><td colspan="2" class="text-muted">Категорий нет</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
